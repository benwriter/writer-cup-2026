<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06162b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Writer Cup" />
  <title>Writer Cup 2026</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-route="home" aria-label="Writer Cup home">
        <img src="./assets/writer-cup-logo.png" alt="Writer Cup 2026 logo" />
      </button>
      <div class="topbar-copy">
        <strong>WRITER CUP</strong>
        <span>24 SEP 2026 · THE COAST</span>
      </div>
      <button class="icon-button" id="moreButton" aria-label="Tournament options">•••</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-item active"><span>🏆</span><small>Home</small></button>
      <button data-route="live" class="nav-item"><span>●</span><small>Live</small></button>
      <button data-route="score" class="nav-item"><span>✎</span><small>Score</small></button>
      <button data-route="course" class="nav-item"><span>⛳</span><small>Course</small></button>
      <button data-route="more" class="nav-item"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
